name: Build FreeBSD Driver

on:
  push:
    branches: [main, master]
    paths:
      - 'bsdmod/**'
      - '.github/workflows/build-freebsd.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'bsdmod/**'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build if_octnic.ko (FreeBSD ${{ matrix.freebsd-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        freebsd-version: [14.5]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build FreeBSD kernel module in VM
        id: build-vm
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.freebsd-version }}
          sync: rsync
          prepare: |
            pkg install -y llvm18 git
          run: |
            cd bsdmod
            make clean 2>/dev/null || true
            make
            echo "=== Build output ==="
            ls -la if_octnic.ko

      - name: Package build artifact
        run: |
          mkdir -p freebsd-build
          cp bsdmod/if_octnic.ko freebsd-build/
          cp bsdmod/README.md freebsd-build/
          echo "FreeBSD ${{ matrix.freebsd-version }}" > freebsd-build/BUILD-INFO
          tar czf if_octnic-freebsd${{ matrix.freebsd-version }}.tar.gz -C freebsd-build .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: if_octnic-freebsd${{ matrix.freebsd-version }}-${{ github.sha }}
          path: if_octnic-freebsd${{ matrix.freebsd-version }}.tar.gz
          retention-days: 30
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            if_octnic-freebsd${{ matrix.freebsd-version }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
