name: Build Windows Driver

on:
  push:
    branches: [main, master]
    paths:
      - 'winmod/**'
      - '.github/workflows/build-windows.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'winmod/**'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build octnic.sys (Windows ${{ matrix.os-version }})
    runs-on: ${{ matrix.os-version }}

    strategy:
      fail-fast: false
      matrix:
        os-version: [windows-2022]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build Windows driver (msbuild)
        working-directory: winmod
        run: |
          echo "Building octnic Windows NDIS driver..."

          # Find msbuild on windows-2022 runner
          $msbuild = Get-Command msbuild -ErrorAction SilentlyContinue
          if (!$msbuild) {
            # Try common VS 2022 paths
            $paths = @(
              "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe",
              "C:\Program Files\Microsoft Visual Studio\2022\Community\MSBuild\Current\Bin\MSBuild.exe",
              "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\MSBuild\Current\Bin\MSBuild.exe"
            )
            foreach ($p in $paths) {
              if (Test-Path $p) { $msbuild = $p; break }
            }
          }

          if (!$msbuild) {
            Write-Error "msbuild not found — check runner MSBuild setup"
            exit 1
          }

          Write-Host "Using msbuild: $($msbuild.Source)"
          & $msbuild octnic.vcxproj /p:Configuration=Release /p:Platform=x64 /m /v:minimal /nologo
        shell: pwsh

      - name: Verify output
        run: |
          Write-Host "=== Build artifacts ==="
          Get-ChildItem -Recurse -Path winmod -Include "*.sys","*.pdb" -ErrorAction SilentlyContinue
          Get-ChildItem -Path winmod\x64\Release -ErrorAction SilentlyContinue

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: octnic-sys-${{ github.sha }}
          path: |
            winmod/x64/Release/octnic.sys
            winmod/x64/Release/octnic.pdb
            winmod/Release/octnic.sys
            winmod/Release/octnic.pdb
          retention-days: 30
          if-no-files-found: warn

      - name: Create release asset (on release)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            winmod/x64/Release/octnic.sys
            winmod/Release/octnic.sys
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
