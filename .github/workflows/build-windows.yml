name: Build Windows Driver

on:
  push:
    branches: [main, master]
    paths:
      - 'winmod/**'
      - '.github/workflows/build-windows.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'winmod/**'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build octnic.sys (Windows ${{ matrix.os-version }})
    runs-on: ${{ matrix.os-version }}

    strategy:
      fail-fast: false
      matrix:
        os-version: [windows-2022]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect WDK SDK version
        id: wdk
        run: |
          $wdk = "C:\Program Files (x86)\Windows Kits\10"
          if (!(Test-Path "$wdk")) {
            Write-Error "WDK not found at $wdk"
            exit 1
          }
          $ver = (Get-ChildItem "$wdk\Include" -Directory |
                  Sort-Object Name -Descending | Select-Object -First 1).Name
          echo "sdk=$ver" >> $env:GITHUB_OUTPUT

      - name: Build driver with nmake (WDK)
        working-directory: winmod
        run: |
          $wdk = "C:\Program Files (x86)\Windows Kits\10"
          $sdk = "${{ steps.wdk.outputs.sdk }}"

          # Set WDK env vars (equivalent to Setenv.cmd - release x64)
          $env:SDK_LIB_PATH   = "$wdk\Lib\$sdk\km\x64"
          $env:DDK_LIB_PATH   = "$wdk\Lib\$sdk\km\x64"
          $env:INT_DIR        = "x64\Release"
          $env:SRC_DIR        = "."

          # Prepend WDK paths to INCLUDE and LIB
          $env:INCLUDE = "$wdk\Include\$sdk;`$wdk\Include\$sdk\km;`$wdk\Include\$sdk\ucrt;`$env:INCLUDE"
          $env:LIB     = "$wdk\Lib\$sdk\km\x64;`$wdk\Lib\$sdk\ucrt\x64;`$env:LIB"

          Write-Host "=== WDK Environment ==="
          Write-Host "SDK_LIB_PATH=$env:SDK_LIB_PATH"
          Write-Host "DDK_LIB_PATH=$env:DDK_LIB_PATH"

          nmake /f Makefile clean 2>$null; $LASTEXITCODE = 0
          nmake /f Makefile
        shell: pwsh

      - name: Verify output
        run: |
          Write-Host "=== Build artifacts ==="
          Get-ChildItem -Recurse -Path winmod -Include "*.sys","*.pdb" -ErrorAction SilentlyContinue
          Get-ChildItem -Path winmod\x64\Release -ErrorAction SilentlyContinue

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: octnic-sys-${{ github.sha }}
          path: |
            winmod/x64/Release/octnic.sys
            winmod/x64/Release/octnic.pdb
            winmod/Release/octnic.sys
            winmod/Release/octnic.pdb
          retention-days: 30
          if-no-files-found: warn

      - name: Create release asset (on release)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            winmod/x64/Release/octnic.sys
            winmod/Release/octnic.sys
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
