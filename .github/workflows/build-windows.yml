name: Build Windows Driver

on:
  push:
    branches: [main, master]
    paths:
      - 'winmod/**'
      - '.github/workflows/build-windows.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'winmod/**'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build octnic.sys (Windows ${{ matrix.os-version }})
    runs-on: ${{ matrix.os-version }}

    strategy:
      fail-fast: false
      matrix:
        os-version: [windows-2022]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build with msbuild (vcxproj)
        working-directory: winmod
        run: |
          Write-Host "=== Building octnic.sys ==="
          # Use full path to MSBuild.exe on windows-2022
          $msbuildPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe"
          if (!(Test-Path $msbuildPath)) {
            Write-Error "MSBuild not found at $msbuildPath"
            exit 1
          }
          & $msbuildPath octnic.vcxproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:WindowsTargetPlatformVersion=10.0.26100.0 `
            /m /v:minimal /nologo
        shell: pwsh

      - name: Verify output
        run: |
          Write-Host "=== Artifacts ==="
          Get-ChildItem -Recurse -Path winmod -Include "*.sys","*.pdb" -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: octnic-sys-${{ github.sha }}
          path: |
            winmod/x64/Release/octnic.sys
            winmod/x64/Release/octnic.pdb
            winmod/Release/octnic.sys
            winmod/Release/octnic.pdb
          retention-days: 30
          if-no-files-found: warn

      - name: Create release asset (on release)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            winmod/x64/Release/octnic.sys
            winmod/Release/octnic.sys
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
