name: Build Windows Driver

on:
  push:
    branches: [main, master]
    paths:
      - 'winmod/**'
      - '.github/workflows/build-windows.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'winmod/**'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build octnic.sys (Windows ${{ matrix.os-version }})
    runs-on: ${{ matrix.os-version }}

    strategy:
      fail-fast: false
      matrix:
        os-version: [windows-2022]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install WDK (if missing)
        shell: pwsh
        run: |
          $sdk = "10.0.26100.0"
          $ndis = "C:\Program Files (x86)\Windows Kits\10\Include\$sdk\km\ndis.h"
          Write-Host "Installed SDK includes:"
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" -ErrorAction SilentlyContinue | ForEach-Object Name
          if (!(Test-Path $ndis)) {
            Write-Host "WDK km headers missing, installing WDK..."
            Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?linkid=2272234" -OutFile wdksetup.exe
            $p = Start-Process -FilePath .\wdksetup.exe -ArgumentList "/features + /q" -Wait -PassThru
            Write-Host "wdksetup exit code: $($p.ExitCode)"
          }
          if (!(Test-Path $ndis)) { Write-Error "ndis.h still missing: $ndis"; exit 1 }
          # VS integration (WindowsKernelModeDriver10.0 toolset)
          $toolset = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\*\MSBuild\Microsoft\VC\*\Platforms\x64\PlatformToolsets\WindowsKernelModeDriver10.0" -ErrorAction SilentlyContinue
          if (!$toolset) {
            $vsix = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Vsix\VS2022" -Recurse -Filter WDK.vsix -ErrorAction SilentlyContinue | Select-Object -First 1
            if (!$vsix) { Write-Error "WDK.vsix not found"; exit 1 }
            $inst = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\*\Common7\IDE\VSIXInstaller.exe" | Select-Object -First 1
            Write-Host "Installing $($vsix.FullName)"
            $p = Start-Process -FilePath $inst.FullName -ArgumentList "/q /a `"$($vsix.FullName)`"" -Wait -PassThru
            Write-Host "VSIXInstaller exit code: $($p.ExitCode)"
          }

      - name: Build with msbuild (vcxproj)
        working-directory: winmod
        shell: pwsh
        run: |
          msbuild octnic.vcxproj /p:Configuration=Release /p:Platform=x64 /p:WindowsTargetPlatformVersion=10.0.26100.0 /m /v:minimal /nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify output
        run: |
          Write-Host "=== Artifacts ==="
          Get-ChildItem -Recurse -Path winmod -Include "*.sys","*.pdb" -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: octnic-sys-${{ github.sha }}
          path: |
            winmod/x64/Release/octnic.sys
            winmod/x64/Release/octnic.pdb
            winmod/Release/octnic.sys
            winmod/Release/octnic.pdb
          retention-days: 30
          if-no-files-found: warn

      - name: Create release asset (on release)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            winmod/x64/Release/octnic.sys
            winmod/Release/octnic.sys
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
